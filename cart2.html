<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .save-amount {
            color: green;
        }
        .free-shipping-bar {
            width: 100%;
            background-color: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-bar {
            height: 10px;
            background-color: #000;
        }
        .discount-code input {
            max-width: 200px;
            margin-right: 10px;
        }
        .special-instructions {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container my-5">
    <h2>Items in the Cart · 1</h2>
    <div class="cart-summary">
        <p>You’re <span id="shipping-amount">1,001.00</span> away from FREE shipping!</p>
    </div>
    <div class="free-shipping-bar">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="cart-item d-flex justify-content-between align-items-center">
        <div class="cart-item-info d-flex align-items-center">
            <img src="ring-image.jpg" alt="Big Flower Ring" width="50" height="50" class="me-3">
            <div>
                <h5>Big Flower Ring</h5>
                <p class="mb-0"><s>199.00 EGP</s> <strong>99.00 EGP</strong></p>
                <p class="save-amount">Save 100.00 EGP</p>
            </div>
        </div>
        <div class="cart-item-quantity">
            <input type="number" class="form-control" value="1" min="1" style="width: 60px;">
        </div>
    </div>

    <div class="special-instructions">
        <label for="instructions">Add special instructions</label>
        <textarea class="form-control" id="instructions" rows="2"></textarea>
    </div>

    <h5>You’ll love these</h5>
    <div class="related-item d-flex justify-content-between align-items-center mb-4">
        <img src="related-item.jpg" alt="Flower Blue Stone" width="50" height="50" class="me-3">
        <div>
            <h6>Flower Blue Stone</h6>
            <p class="mb-0"><s>199.00 EGP</s> <strong>99.00 EGP</strong></p>
        </div>
        <button class="btn btn-primary" onclick="addToCart()">Add</button>
    </div>

    <div class="discount-code d-flex align-items-center">
        <input type="text" class="form-control" placeholder="Discount code">
        <button class="btn btn-outline-primary">Apply</button>
    </div>

    <div class="text-end mt-4">
        <button class="btn btn-dark">Proceed to Checkout: 99.00 EGP</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function addToCart() {
        alert('Item added to cart!');
        // Logic to update the cart can go here
    }
</script>
</body>
</html>
