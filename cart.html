<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Reset بعض القيم الافتراضية */
body, h1, p, button {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background-color: #f5f5f5;
}

#main-content {
    padding: 20px;
}

/* تصميم الشريط الجانبي للسلة */
.cart-sidebar {
    width: 300px;
    background-color: white;
    position: fixed;
    top: 0;
    right: -300px;
    height: 100%;
    box-shadow: -2px 0 5px rgba(0,0,0,0.5);
    transition: right 0.3s ease;
    z-index: 1000;
}

.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background-color: #000;
    color: white;
}

.cart-content {
    padding: 20px;
}

/* تصميم الخلفية الخافتة */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 500;
}

/* عند فتح السلة */
.cart-sidebar.open {
    right: 0;
}

.overlay.open {
    display: block;
}

    </style>
</head>
<body>
    <div id="main-content">
        <!-- محتوى الصفحة الرئيسي -->
        <div class="products">
            <h1>Products</h1>
            <!-- يمكن إضافة المزيد من المنتجات هنا -->
        </div>
        <button onclick="openCart()">View Cart</button>
    </div>

    <!-- الشريط الجانبي للسلة -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <span>Items in the Cart</span>
            <button onclick="closeCart()">×</button>
        </div>
        <div class="cart-content">
            <!-- محتوى السلة -->
            <p>Your cart is empty.</p>
        </div>
    </div>

    <div id="overlay" class="overlay" onclick="closeCart()"></div>

    <script src="script.js"></script>
    <script>
        function openCart() {
    document.getElementById('cart-sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('open');
}

function closeCart() {
    document.getElementById('cart-sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
}

    </script>
</body>
</html>
